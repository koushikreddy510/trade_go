services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  atlas:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      REDIS_ADDR: redis:6379
    ports:
      - "8080:8080"
    command: ["-config", "/app/configs/atlas.paper.yaml", "-serve"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  redis-data:
